server {
    listen 80;
    server_name kyc-bots.com www.kyc-bots.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name kyc-bots.com www.kyc-bots.com;
    
    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/kyc-bots.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kyc-bots.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # Main application proxy
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Los reportes requieren firma, vencimiento y comprobación de revocación.
    location ^~ /reports/ {
        access_log off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Retirar también cualquier alias heredado definido en otros includes.
    location /temp { return 410; }
    location /pdfs { return 410; }

    # La aplicación decide si las dependencias están disponibles (200 / 503).
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:3001;
    }

    # Block access to sensitive files
    location ~ /\.(ht|env|git) {
        deny all;
    }
    
    # Logs
    access_log /var/log/nginx/kyc-bots.access.log;
    error_log /var/log/nginx/kyc-bots.error.log warn;
}
